<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* background:
                radial-gradient(circle at 50% 48%,
                    rgba(184, 145, 72, 0.10) 0%,
                    transparent 28%),

                radial-gradient(circle at 85% 15%,
                    rgba(130, 15, 25, 0.16) 0%,
                    transparent 32%),

                radial-gradient(circle at 10% 85%,
                    rgba(110, 12, 20, 0.12) 0%,
                    transparent 35%),

                linear-gradient(125deg,
                    #050606 0%,
                    #0B0D0D 28%,
                    #151514 52%,
                    #211917 76%,
                    #35090D 100%);

            position: relative;
            overflow: hidden; */
            background-image: url(assets2/images/vs.png);
            /* background-size: cover; */
            background-position: -230px 0;
        }

        ul {
            width: 400px;
            height: 800px;
            /* border: 1px solid red; */
            margin: -50px 700px;
            /* margin-top: 100px; */
            display: flex;
            justify-content: center;
            align-items: center;
            display: flex;
            flex-direction: column;
            transform: rotate3d(1.3, 1, 1, 279deg);
            transform-style: preserve-3d;

            >li {
                width: 100%;
                height: 100%;
                list-style-type: none;
                /* border: 5px solid white; */
                overflow: hidden;
                >h2 {
                    &:nth-of-type(1){
                        animation: Ghost 4s linear infinite alternate;
                    }
                    color: rgba(255, 255, 255, 0.777);
                    width: 100%;
                    height: 100%;
                    /* border: 1px solid yellow; */
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 70px;
                    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                    transition: 5s linear;
                    text-transform: capitalize;
                }

                &:nth-of-type(2) {
                    transform-origin: right;
                    transform: rotateX(90deg) translateZ(80px) translateY(80px);
                    /* border: 5px solid black; */
                }

                &:nth-of-type(3) {
                    transform: translateY(-160px) translateZ(160px);
                    /* border: 5px solid red; */
                }

                &:nth-of-type(4) {
                    transform-origin: right;
                    transform: rotateX(90deg) translateZ(240px) translateY(240px);
                    /* border: 5px solid blue; */
                }

                &:nth-of-type(5) {
                    transform: translateY(-320px) translateZ(320px);
                }


            }
        }
        @keyframes Ghost{
            0%{margin-top: 0;}
            100%{margin-top: -160px;}
        }
    </style>
</head>

<body>
    <ul>
        <li>

        </li>

        </li>
        <li>
            <h2>and</h2>
            <h2>no honor</h2>
        </li>
        <li>
            <h2>no honor</h2>
            <h2>You have</h2>
        </li>
        <li>
            <h2>You have</h2>
            <h2>slave to it</h2>
        </li>
    </ul>

</body>

</html>
